[workspace]
members = ["crates/gitview", "crates/gitview-core", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/trypsynth/gitview"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

# Until a wxDragon release has Event::event_object_ptr, which wx-utils' tasks need.
[patch.crates-io]
wx-utils = { git = "https://github.com/accessware/wx-utils", rev = "ee936a1" }
wxdragon = { git = "https://github.com/AllenDang/wxDragon", rev = "1d56121" }
