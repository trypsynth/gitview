[package]
name = "gitview"
description = "An accessible, screen reader first GitHub client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
doorbell = "0.1.0"
gitview-core = { path = "../gitview-core" }
homeport = "0.1.0"
keyring = "4.2.0"
live-region = "0.3.3"
quiet-list = "0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
wx-utils = { version = "0.5.2", features = ["tasks"] }
wxdragon = { version = "0.9.24", features = ["webview"] }

[build-dependencies]
shipfitter = { version = "0.2.5", features = ["windows-resources"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
