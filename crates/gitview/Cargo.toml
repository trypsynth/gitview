[package]
name = "gitview"
description = "An accessible, screen reader first GitHub client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gitview-core = { path = "../gitview-core" }
keyring = "4.2.0"
live-region = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
wx-utils = "0.3.1"
wxdragon = { version = "0.9.22", features = ["webview"] }

[build-dependencies]
embed-manifest = "1.5.1"

[lints]
workspace = true
